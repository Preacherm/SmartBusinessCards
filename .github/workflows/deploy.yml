name: Deploy Smart Business Cards to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-business-cards-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Only deploy main, including manual runs.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v6

      - name: Deploy files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21
          security: strict

          local-dir: ./

          # FTP account root is the cards website folder.
          server-dir: ./

          # Timeout for individual FTP operations, in milliseconds.
          timeout: 60000
          log-level: standard

          dry-run: false

          # Disable wiping the entire destination.
          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/error_log
            **/*.log
            **/*.sql
            **/README.md
            documentation/**
            tests/**
            storage/**